name: publish

# Publishing pipeline for an environment that can `git push` to github.com
# but cannot reach api.github.com:
#
#   1. Push each project as a branch named  incoming/<repo-name>
#      (tip commit = the project tree + .repo-meta.json, commit message
#      = the message you want on the published repo).
#   2. Push any commit to main (an empty one is fine) to trigger this
#      workflow. It sweeps ALL incoming/* branches: for each one it
#      creates the target repo if missing (description from
#      .repo-meta.json, via the REPO_CREATE_TOKEN secret), force-pushes
#      the branch content minus .repo-meta.json to the target's main,
#      and deletes the incoming branch.
#
# The sweep design is deliberate: `on: push` for the incoming branches
# themselves can't work (push-event workflows run from the pushed ref,
# which carries no workflow file) and `on: create` proved unreliable for
# branches created via git push. Pushes to main always fire, and a sweep
# picks up anything pending, including branches left over from a
# previously failed run.
#
# Requires one repository secret: REPO_CREATE_TOKEN — a classic PAT with
# `repo` scope (used to create target repos and push to them).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out factory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish all incoming/* branches
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATE_TOKEN }}
          FACTORY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The runner injects `bash -e`; we handle errors per-project instead.
          set +e
          set -u
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret REPO_CREATE_TOKEN is not set on this repository."
            exit 1
          fi
          git config user.name  "${GITHUB_REPOSITORY_OWNER}"
          git config user.email "${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"

          git fetch -q origin '+refs/heads/incoming/*:refs/incoming/*'
          REFS=$(git for-each-ref --format='%(refname)' refs/incoming/)
          if [ -z "$REFS" ]; then
            echo "Nothing to publish (no incoming/* branches)."
            exit 0
          fi

          FAILED=""
          for REF in $REFS; do
            NAME="${REF#refs/incoming/}"
            echo "::group::Publishing $NAME"
            if (
              set -e
              git checkout -q --detach "$REF"
              DESC=""
              if [ -f .repo-meta.json ]; then
                DESC=$(jq -r '.description // ""' .repo-meta.json)
              fi
              BODY=$(jq -n --arg n "$NAME" --arg d "$DESC" '{name:$n, description:$d, private:false}')
              STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
                https://api.github.com/user/repos \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                --data "$BODY")
              if [ "$STATUS" = "201" ]; then
                echo "Target repo created."
              elif [ "$STATUS" = "422" ]; then
                echo "Target repo already exists — publishing into it."
              else
                echo "::error::Repo creation for $NAME returned HTTP $STATUS: $(cat /tmp/resp.json)"
                exit 1
              fi
              if [ -f .repo-meta.json ]; then
                git rm -q .repo-meta.json
                git commit -q --amend --no-edit
              fi
              git push --force \
                "https://${GITHUB_REPOSITORY_OWNER}:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/${NAME}.git" \
                HEAD:refs/heads/main
              echo "Published: https://github.com/${GITHUB_REPOSITORY_OWNER}/${NAME}"
            ); then
              git push -q "https://x-access-token:${FACTORY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                --delete "incoming/${NAME}" || true
            else
              echo "::error::Publishing $NAME failed — branch kept for the next sweep; see this run's log group for details."
              FAILED="$FAILED $NAME"
            fi
            git reset --hard -q; git clean -fdq; git checkout -q main || true
            echo "::endgroup::"
          done

          if [ -n "$FAILED" ]; then
            echo "::error::Failed to publish:$FAILED"
            exit 1
          fi
